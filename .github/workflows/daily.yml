name: daily-activity
on:
  schedule:
    - cron: "5 18 * * *"    # 23:05 Dushanbe (main)
    - cron: "40 18 * * *"   # 23:40 Dushanbe (backup if main was skipped)
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/daily.sh
